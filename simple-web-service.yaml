apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-web-service
  labels:
    app: simple-web-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-web-service
  template:
    metadata:
      labels:
        app: simple-web-service
    spec:
      containers:
        - name: web
          image: nginx:stable
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: simple-web-service
  labels:
    app: simple-web-service
spec:
  type: LoadBalancer
  selector:
    app: simple-web-service
  ports:
    - name: https
      port: 443
      targetPort: http
      nodePort: 30443
      protocol: TCP

